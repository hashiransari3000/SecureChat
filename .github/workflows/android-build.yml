name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build APK + AAB (minSdk 29, Android 10+)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            securechat-frontend/frontend/package-lock.json
            securechat-android/package-lock.json

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('securechat-android/android/**/*.gradle', 'securechat-android/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}

      - name: Install + build frontend
        working-directory: securechat-frontend/frontend
        run: |
          npm ci
          npm run build

      - name: Install Capacitor tooling
        working-directory: securechat-android
        run: npm ci

      - name: Sync web assets into Android project
        working-directory: securechat-android
        run: npx cap sync android

      - name: Set up JDK 21 (required by Capacitor 7)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK + bundle
        working-directory: securechat-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleDebug --console=plain

      - name: Upload APK + AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: securechat-android
          if-no-files-found: error
          path: |
            securechat-android/android/app/build/outputs/apk/debug/app-debug.apk
            securechat-android/android/app/build/outputs/bundle/debug/app-debug.aab